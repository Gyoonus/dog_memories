<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>다섯 강아지의 추억</title>
  <meta name="description" content="강아지를 골라 추억의 장소로 들어가는 3D 공간. 핑키와 함께하는 푸맘네 집, 담이와 함께하는 동네 놀이터, 푸푸와 함께하는 남산 산책길, 재롱이와 함께하는 과천 호숫가 잔디밭, 알팡이와 함께하는 의왕 아울렛." />
  <meta name="theme-color" content="#16100c" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" />
  <link rel="stylesheet" href="style.css?v=29" />
</head>
<body>
<div id="stage"><canvas id="c" aria-label="강아지와 추억의 장소 3D 화면"></canvas></div>
<div class="vignette"></div>
<div id="bubbles"></div>

<section id="selectUI" class="ui" aria-label="강아지 고르기">
  <header class="sel-head">
    <p class="eyebrow">추억의 장소로</p>
    <h1>누구를 만나러 갈까</h1>
  </header>
  <div class="sel-bottom">
    <div class="sel-card glass">
      <div class="who"><span class="name" id="selName">핑키</span><span class="place" id="selPlace">푸맘네 집</span></div>
      <button id="goBtn" class="go" type="button">만나러 가기</button>
    </div>
    <div class="chips" id="chips" role="tablist" aria-label="강아지 목록"></div>
  </div>
  <button id="sndBtnSel" class="snd sel-snd glass" type="button" aria-pressed="true" aria-label="소리" title="소리 끄기">🔊</button>
  <button class="arrow left glass" id="prevBtn" type="button" aria-label="이전 강아지">‹</button>
  <button class="arrow right glass" id="nextBtn" type="button" aria-label="다음 강아지">›</button>
</section>

<section id="roomUI" class="ui" aria-label="추억의 장소" hidden>
  <div id="pickBack" hidden></div>
  <header class="room-head">
    <button id="backBtn" class="back glass" type="button">‹ 친구들</button>
    <div class="title"><span class="name">핑키</span><span class="place">푸맘네 집 · 이태원동</span></div>
    <!-- 방명록은 방 안의 책을 눌러 연다. 이 단추는 키보드 · 화면 읽기용 (탭으로 왔을 때만 보인다) -->
    <button id="gbKey" class="gb-open gb-skip glass" type="button" aria-haspopup="dialog" aria-controls="gb" aria-expanded="false"><span aria-hidden="true">📖</span> 방명록 열기</button>
    <button id="sndBtn" class="snd glass" type="button" aria-pressed="true" aria-label="소리" title="소리 끄기">🔊</button>
  </header>
  <div class="room-bottom">
    <p class="hint" id="hint">핑키를 만지면 좋아해요 · 화면을 끌어서 둘러보기</p>
    <nav class="actions glass" id="actions" aria-label="핑키랑 하기">
      <button type="button" data-cmd="pet"><span class="ic" aria-hidden="true">✋</span>쓰다듬기</button>
      <button type="button" data-cmd="play" data-menu="play" aria-haspopup="menu" aria-expanded="false"><span class="ic" aria-hidden="true">🎾</span>놀아주기</button>
      <button type="button" data-cmd="treat" data-menu="treat" aria-haspopup="menu" aria-expanded="false"><span class="ic" aria-hidden="true">🦴</span>간식</button>
      <button type="button" data-cmd="feed"><span class="ic" aria-hidden="true">🍚</span>밥 주기</button>
      <button type="button" data-cmd="hug"><span class="ic" aria-hidden="true">🤗</span>안기</button>
      <button type="button" data-cmd="sit"><span class="ic" aria-hidden="true">🐾</span>앉아</button>
      <button type="button" data-cmd="down"><span class="ic" aria-hidden="true">🛋️</span>엎드려</button>
      <button type="button" data-cmd="paw" hidden><span class="ic" aria-hidden="true">🤝</span>손</button>
      <button type="button" data-cmd="high5" hidden><span class="ic" aria-hidden="true">🙌</span>하이파이브</button>
      <button type="button" data-cmd="roll"><span class="ic" aria-hidden="true">🫠</span>드러눕기</button>
      <button type="button" data-cmd="sniff"><span class="ic" aria-hidden="true">👃</span>냄새 맡기</button>
      <button type="button" data-cmd="cushion"><span class="ic" aria-hidden="true">🍩</span>방석</button>
      <button type="button" data-cmd="worm" hidden><span class="ic" aria-hidden="true">🪱</span>지렁이 댄스</button>
      <button type="button" data-cmd="zoom" hidden><span class="ic" aria-hidden="true">💨</span>우다다</button>
      <button type="button" data-cmd="dig" hidden><span class="ic" aria-hidden="true">🕳️</span>땅 파기</button>
      <button type="button" data-cmd="splash" hidden><span class="ic" aria-hidden="true">💦</span>물장구</button>
      <button type="button" data-cmd="poop" hidden><span class="ic" aria-hidden="true">💩</span>똥츄</button>
      <button type="button" data-cmd="mat" hidden><span class="ic" aria-hidden="true">🧺</span>돗자리</button>
      <button type="button" data-cmd="run" hidden><span class="ic" aria-hidden="true">🐕</span>달려오기</button>
      <button type="button" data-cmd="kiss" hidden><span class="ic" aria-hidden="true">💋</span>뽀뽀하기</button>
      <button type="button" data-cmd="lean" hidden><span class="ic" aria-hidden="true">🤲</span>만져줘</button>
      <button type="button" data-cmd="box" hidden><span class="ic" aria-hidden="true">🎁</span>에르메스 상자</button>
    </nav>
  </div>
  <div id="picker" class="picker glass" role="menu" hidden></div>
</section>

<!-- 방명록 (guestbook.js) -->
<div id="gb" class="gb" hidden>
  <div class="gb-back"></div>
  <section class="gb-panel" id="gbPanel" role="dialog" aria-modal="true" aria-labelledby="gbTitle" tabindex="-1">
    <header class="gb-head">
      <div class="gb-titles">
        <p class="gb-eyebrow" id="gbPlace">추억의 장소</p>
        <h2 id="gbTitle">방명록</h2>
      </div>
      <div class="gb-me" id="gbMe" hidden>
        <span class="gb-me-name" id="gbMeName"></span>
        <button type="button" class="gb-link" id="gbOut">나가기</button>
      </div>
      <button type="button" class="gb-x" data-gb-close aria-label="방명록 닫기">✕</button>
    </header>
    <div class="gb-scroll" id="gbScroll">
      <div class="gb-screen gb-setup" id="gbSetup" hidden>
        <p class="gb-big" aria-hidden="true">🕯️</p>
        <p class="gb-lead">방명록은 준비 중이에요</p>
        <p class="gb-soft">곧 열릴 거예요. 조금만 기다려 주세요.</p>
        <button type="button" class="gb-btn" data-gb-close>닫기</button>
      </div>
      <form class="gb-screen gb-login" id="gbLogin" hidden autocomplete="off" novalidate>
        <p class="gb-lead" id="gbLoginLead">추억을 남겨 주세요</p>
        <p class="gb-soft">식구와 이모 · 삼촌만 들어올 수 있어요</p>
        <p class="gb-label" id="gbWhoLbl">누구세요?</p>
        <div class="gb-names" id="gbNames" role="radiogroup" aria-labelledby="gbWhoLbl"></div>
        <div class="gb-guest" id="gbGuestBox" hidden>
          <label class="gb-label" for="gbGuest">이름</label>
          <input id="gbGuest" class="gb-input gb-guest-in" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="20" placeholder="예: 영희 이모" enterkeyhint="next" aria-describedby="gbGuestHint" />
          <p class="gb-hint" id="gbGuestHint">이름 뒤에 '이모'나 '삼촌'을 붙여 주세요</p>
        </div>
        <label class="gb-label" for="gbPass">비밀번호 <small id="gbPassHint">숫자 8자리</small></label>
        <div class="gb-passwrap">
          <input id="gbPass" class="gb-input gb-pass" type="password" inputmode="numeric" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="12" enterkeyhint="go" />
          <button type="button" class="gb-peek" id="gbPeek" aria-controls="gbPass" aria-label="비밀번호 보기">보기</button>
        </div>
        <p class="gb-msg err" id="gbLoginErr" role="alert"></p>
        <button type="submit" class="gb-btn primary" id="gbEnter">들어가기</button>
      </form>
      <div class="gb-screen gb-wait" id="gbWait" hidden>
        <p class="gb-soft" id="gbWaitMsg" role="status">방명록을 여는 중…</p>
        <button type="button" class="gb-btn" id="gbRetry" hidden>다시 해 보기</button>
      </div>
      <div class="gb-screen gb-book" id="gbBook" hidden>
        <form class="gb-compose" novalidate>
          <textarea id="gbText" class="gb-input gb-text-in" rows="4" maxlength="2000" placeholder="따뜻한 한마디를 남겨 주세요" aria-label="남길 글"></textarea>
          <div class="gb-row">
            <span class="gb-count" id="gbCount">0/500</span>
            <p class="gb-msg" id="gbSendMsg" role="status"></p>
            <button type="submit" class="gb-btn primary" id="gbSend" disabled>남기기</button>
          </div>
        </form>
        <ol class="gb-list" id="gbList"></ol>
        <p class="gb-soft gb-listmsg" id="gbListMsg" role="status" hidden></p>
        <p class="gb-empty" id="gbEmpty" hidden></p>
        <button type="button" class="gb-btn gb-more" id="gbMore" hidden>더 보기</button>
      </div>
    </div>
  </section>
</div>

<div id="toast" class="glass" role="status"></div>
<div id="fade"></div>
<div id="boot">불을 켜는 중…</div>

<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module" src="main.js?v=29"></script>
<script type="module" src="guestbook.js?v=29"></script>
</body>
</html>
